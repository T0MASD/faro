---
name: CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

env:
  # The MINOR-level kinc tag, deliberately - not an exact build, and not
  # :latest.
  #
  # An exact pin rots. This sat at v1.36.4-0 while the estate ran v1.37.0-6,
  # so faro was tested against an older Kubernetes minor than it shipped into,
  # and nobody noticed until someone went looking - which is the one gap a pin
  # is supposed to close rather than create.
  #
  # :latest is worse in the other direction: it crosses Kubernetes MINORS
  # without warning. v1.36 -> v1.37 replaced kindnet with Antrea, whose OVS
  # datapath needs a different host contract, and on :latest that lands in CI
  # on an ordinary afternoon and turns every open pull request red for reasons
  # that have nothing to do with any of them.
  #
  # v1.37-latest tracks every kinc patch and rebuild automatically - v1.37.1-0,
  # v1.37.1-1, v1.37.2-0 all arrive with nothing to bump - while crossing a
  # minor stays a one-line change somebody chooses to make. Which is right: a
  # minor bump is a real event and deserves a pull request of its own.
  KINC_IMAGE: ghcr.io/t0masd/kinc:v1.37-latest

jobs:
  # The operator image is built only at release, so nothing here ever compiled
  # the Dockerfile - which is how it went unnoticed that the binary was pinned
  # to amd64 while the image was labelled for whatever built it. This builds
  # both platforms and does not push, so the release path is exercised on the
  # pull request that changes it.
  image:
    name: Operator image (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build both platforms
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=/tmp/faro-operator.oci

      - name: The arm64 binary is actually arm64
        run: |
          set -euo pipefail
          # Built per-architecture and then run: a wrong GOARCH produces an
          # image that pulls and schedules and only fails when it execs, which
          # is far too late to learn it.
          docker buildx build --platform linux/arm64 --load -t faro-arm64-probe .
          got=$(docker run --rm --entrypoint "" --platform linux/arm64 faro-arm64-probe \
                  /bin/sh -c 'uname -m')
          echo "  runtime reports: $got"
          case "$got" in aarch64|arm64) ;; *) echo "::error::expected aarch64, got $got"; exit 1 ;; esac
          # And the binary itself, not just the shell beside it.
          docker run --rm --entrypoint "" --platform linux/arm64 faro-arm64-probe \
            /usr/local/bin/faro-operator --help >/dev/null 2>&1 \
            || docker run --rm --entrypoint "" --platform linux/arm64 faro-arm64-probe \
                 /usr/local/bin/faro-operator --version >/dev/null 2>&1 \
            || { echo "::error::the arm64 binary does not execute"; exit 1; }
          echo "  the arm64 operator binary runs"

  test:
    name: Library Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          # Cache handled below. setup-go's own key is
          #   setup-go-${os}-${arch}-go-${version}-${hashFiles('**/go.mod')}
          # which is identical for every job in this workflow, so the parallel
          # jobs race to write one entry and the loser's work is discarded.
          # Actions cache entries are immutable, so whoever wins is what
          # everyone restores until a go.mod changes.
          cache: false

      - name: Go caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # Scoped per job, so lint/test/operator no longer collide. The run id
          # makes an exact hit impossible on purpose: a fresh entry is written
          # every run and restore-keys pull the nearest previous one, so the
          # cache keeps up with the code instead of freezing until a dependency
          # changes. go.sum is hashed as well as go.mod - this repo has five
          # modules and the sums are what actually pin the downloads.
          key: go-${{ runner.os }}-${{ github.job }}-1.24-${{ hashFiles('**/go.sum', '**/go.mod') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-1.24-${{ hashFiles('**/go.sum', '**/go.mod') }}-
            go-${{ runner.os }}-${{ github.job }}-1.24-

      # Deploy kinc cluster for Kubernetes testing
      - name: Deploy kinc cluster
        run: |
          # Enable IP forwarding (required for kinc networking)
          echo 1 | sudo tee /proc/sys/net/ipv4/ip_forward
          # Antrea's datapath is Open vSwitch, and a rootless nested container cannot
          # load a kernel module - kinc's own tools say so and check for it
          # (tools/deploy.sh and tools/join-host.sh), and kinc's CI host prep does
          # exactly this (tools/ci-prepare-host.sh). Without them antrea-agent never
          # starts, so /var/run/antrea/cni.sock is never created and EVERY pod sandbox
          # fails with
          #
          #   plugin type="antrea" failed (add): dial unix /var/run/antrea/cni.sock:
          #   connect: no such file or directory
          #
          # The control plane still comes up, which is what makes it confusing: the
          # failure looks like a slow cluster rather than a missing module.
          #
          # A module compiled into the kernel never appears in /sys/module, so
          # modules.builtin is consulted too.
          sudo modprobe openvswitch || true
          sudo modprobe geneve || true
          for m in openvswitch geneve; do
            if [ -d "/sys/module/$m" ]; then echo "  kernel module $m: loaded"
            elif grep -qw "$m" "/lib/modules/$(uname -r)/modules.builtin" 2>/dev/null; then echo "  kernel module $m: builtin"
            else echo "::warning::kernel module $m is not available; Antrea will not start"; fi
          done
          
          # Create volume for persistent data
          podman volume create kinc-var-data
          
          # Antrea's datapath is Open vSwitch, and kinc v1.37 replaced kindnet with it.
          # OVS needs more of the host than kindnet did. kinc's own quadlet
          # (runtime/quadlet/kinc-control-plane.container) states the contract: the full
          # capability set, /dev/fuse, /lib/modules, and a /run and /var that PROPAGATE
          # mounts, so network namespaces created inside the cluster container are
          # visible to the agent. A rootless nested container cannot load a kernel
          # module itself, so /lib/modules has to come from the host.
          #
          # This block predates that change and met none of the last three, which is why
          # every antrea-agent sat un-Ready until kubectl wait gave up.
          # Start kinc cluster with baked-in configuration (zero-config deployment)
          podman run -d --name kinc-cluster \
            --hostname kinc-control-plane \
            --cgroups=split \
            --cap-add=all \
            --device /dev/fuse \
            --tmpfs /tmp:rw,rprivate,nosuid,nodev,tmpcopyup \
            --tmpfs /run:rw,rshared,nosuid,nodev,tmpcopyup \
            --tmpfs /run/lock:rw,rprivate,nosuid,nodev,tmpcopyup \
            --volume kinc-var-data:/var:rw,rshared \
            --volume /lib/modules:/lib/modules:ro \
            --volume $HOME/.local/share/containers/storage:/root/.local/share/containers/storage:rw \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv6.conf.all.keep_addr_on_down=1 \
            --sysctl net.netfilter.nf_conntrack_tcp_timeout_established=86400 \
            --sysctl net.netfilter.nf_conntrack_tcp_timeout_close_wait=3600 \
            -p 127.0.0.1:6443:6443/tcp \
            --env container=podman \
            ${{ env.KINC_IMAGE }}
          
          echo "⏳ Waiting for kinc cluster initialization..."
          echo "   First run: 2-5 minutes (downloads container images)"
          echo "   Subsequent runs: ~40 seconds (images cached)"
          
          # Wait for API server to start and be ready (check for HTTP 200)
          timeout 300 bash -c 'until curl -k -s -o /dev/null -w "%{http_code}" https://localhost:6443/healthz 2>/dev/null | grep -q "200"; do sleep 2; done'
          echo "✅ API server responding"
          # Wait for kinc's OWN completion signal before asking kubectl anything.
          #
          # kinc-postinit writes /var/lib/kinc-initialized when the cluster has finished
          # coming up, and kinc's deploy.sh and run-validation.sh both wait on exactly
          # this. The API answering /healthz is not that signal: it responds while
          # postinit is still applying addons, so everything after it was racing.
          #
          # This is what made "Waiting for storage provisioner..." fail on v1.37 - the
          # local-path-storage namespace had simply not been created yet, and 60 seconds
          # of guessing was standing in for a signal the container was already offering.
          timeout 300 bash -c 'until podman exec kinc-cluster test -f /var/lib/kinc-initialized 2>/dev/null; do sleep 2; done' || true
          # If kinc never reports ready, say why. Without this the step fails with a
          # bare exit 124 and the container is thrown away by the cleanup step, so every
          # diagnosis costs another full run.
          if ! podman exec kinc-cluster test -f /var/lib/kinc-initialized 2>/dev/null; then
            echo "::group::kinc did not finish initialising - diagnostics"
            echo "--- failed/activating units ---"
            podman exec kinc-cluster systemctl list-units --type=service --state=failed,activating --no-legend --no-pager 2>&1 | head -20 || true
            echo "--- kubeadm-init.log (tail) ---"
            podman exec kinc-cluster tail -60 /var/log/kinc/kubeadm-init.log 2>&1 || true
            echo "--- kubelet errors ---"
            podman exec kinc-cluster journalctl -u kubelet --no-pager -n 300 2>&1 | grep -iE "error|fail" | tail -20 || true
            echo "--- crictl ---"
            podman exec kinc-cluster crictl ps -a 2>&1 | head -15 || true
            echo "::endgroup::"
            exit 1
          fi
          echo "✅ kinc reports initialization complete"
          
          # Extract kubeconfig
          mkdir -p ~/.kube
          podman cp kinc-cluster:/etc/kubernetes/admin.conf ~/.kube/config
          sed -i 's|server: https://.*:6443|server: https://127.0.0.1:6443|g' ~/.kube/config
          
          # Wait for all system pods to be ready
          echo "⏳ Waiting for system pods to be ready..."
          # kubectl wait --all ERRORS IMMEDIATELY when the namespace holds no pods
          # yet - "no matching resources found". That is not a timeout, so --timeout
          # never applies and the step fails in seconds. The API answers /healthz
          # before the static pod manifests have been read, so there is a window where
          # the namespace is empty. Wait for a pod to EXIST before waiting for Ready.
          timeout 120 bash -c 'until [ "$(kubectl get pods -n kube-system --no-headers 2>/dev/null | wc -l)" -gt 0 ]; do sleep 2; done'
          kubectl wait --for=condition=Ready pods --all -n kube-system --timeout=300s
          
          # Wait for local-path-storage namespace and pods to exist (may take a moment to be created)
          echo "⏳ Waiting for storage provisioner..."
          timeout 60 bash -c 'until kubectl get namespace local-path-storage >/dev/null 2>&1; do sleep 2; done'
          timeout 60 bash -c 'until kubectl get pods -n local-path-storage 2>/dev/null | grep -q local-path-provisioner; do sleep 2; done'
          # kubectl wait --all ERRORS IMMEDIATELY when the namespace holds no pods
          # yet - "no matching resources found". That is not a timeout, so --timeout
          # never applies and the step fails in seconds. The API answers /healthz
          # before the static pod manifests have been read, so there is a window where
          # the namespace is empty. Wait for a pod to EXIST before waiting for Ready.
          timeout 120 bash -c 'until [ "$(kubectl get pods -n local-path-storage --no-headers 2>/dev/null | wc -l)" -gt 0 ]; do sleep 2; done'
          kubectl wait --for=condition=Ready pods --all -n local-path-storage --timeout=60s
          
          # Verify cluster
          echo ""
          echo "📊 Cluster Status:"
          kubectl get nodes -o wide
          kubectl get pods -A
          kubectl cluster-info

      # Run comprehensive test suite
      - name: Run full test suite
        run: |
          go mod tidy
          make test

      # Collect and upload test logs and events
      - name: Upload test logs and events
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ github.run_number }}
          path: |
            tests/**/*.log
            tests/**/*.json
          retention-days: 30
        continue-on-error: true

      # Validate library can be imported
      - name: Validate library import
        run: |
          cat > test_import.go << 'EOF'
          package main
          import _ "github.com/T0MASD/faro/pkg"
          func main() {}
          EOF
          go mod tidy
          go build test_import.go
          rm test_import.go

      # Compiles the examples too. The import check above builds one generated
      # file and `make build` builds main.go, so an example that stopped
      # matching the library was never compiled by anything.
      - name: Build all packages
        run: go build ./...

      # Cleanup kinc cluster
      - name: Cleanup kinc cluster
        if: always()
        run: |
          podman rm -f kinc-cluster || true
          podman volume rm kinc-var-data || true

  test-operator:
    name: Operator Deployment Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          # Cache handled below. setup-go's own key is
          #   setup-go-${os}-${arch}-go-${version}-${hashFiles('**/go.mod')}
          # which is identical for every job in this workflow, so the parallel
          # jobs race to write one entry and the loser's work is discarded.
          # Actions cache entries are immutable, so whoever wins is what
          # everyone restores until a go.mod changes.
          cache: false

      - name: Go caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # Scoped per job, so lint/test/operator no longer collide. The run id
          # makes an exact hit impossible on purpose: a fresh entry is written
          # every run and restore-keys pull the nearest previous one, so the
          # cache keeps up with the code instead of freezing until a dependency
          # changes. go.sum is hashed as well as go.mod - this repo has five
          # modules and the sums are what actually pin the downloads.
          key: go-${{ runner.os }}-${{ github.job }}-1.24-${{ hashFiles('**/go.sum', '**/go.mod') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-1.24-${{ hashFiles('**/go.sum', '**/go.mod') }}-
            go-${{ runner.os }}-${{ github.job }}-1.24-

      # Deploy kinc cluster for Kubernetes testing
      - name: Deploy kinc cluster
        run: |
          # Enable IP forwarding (required for kinc networking)
          echo 1 | sudo tee /proc/sys/net/ipv4/ip_forward
          # Antrea's datapath is Open vSwitch, and a rootless nested container cannot
          # load a kernel module - kinc's own tools say so and check for it
          # (tools/deploy.sh and tools/join-host.sh), and kinc's CI host prep does
          # exactly this (tools/ci-prepare-host.sh). Without them antrea-agent never
          # starts, so /var/run/antrea/cni.sock is never created and EVERY pod sandbox
          # fails with
          #
          #   plugin type="antrea" failed (add): dial unix /var/run/antrea/cni.sock:
          #   connect: no such file or directory
          #
          # The control plane still comes up, which is what makes it confusing: the
          # failure looks like a slow cluster rather than a missing module.
          #
          # A module compiled into the kernel never appears in /sys/module, so
          # modules.builtin is consulted too.
          sudo modprobe openvswitch || true
          sudo modprobe geneve || true
          for m in openvswitch geneve; do
            if [ -d "/sys/module/$m" ]; then echo "  kernel module $m: loaded"
            elif grep -qw "$m" "/lib/modules/$(uname -r)/modules.builtin" 2>/dev/null; then echo "  kernel module $m: builtin"
            else echo "::warning::kernel module $m is not available; Antrea will not start"; fi
          done
          
          # Create volume for persistent data
          podman volume create kinc-var-data
          
          # Antrea's datapath is Open vSwitch, and kinc v1.37 replaced kindnet with it.
          # OVS needs more of the host than kindnet did. kinc's own quadlet
          # (runtime/quadlet/kinc-control-plane.container) states the contract: the full
          # capability set, /dev/fuse, /lib/modules, and a /run and /var that PROPAGATE
          # mounts, so network namespaces created inside the cluster container are
          # visible to the agent. A rootless nested container cannot load a kernel
          # module itself, so /lib/modules has to come from the host.
          #
          # This block predates that change and met none of the last three, which is why
          # every antrea-agent sat un-Ready until kubectl wait gave up.
          # Start kinc cluster with baked-in configuration (zero-config deployment)
          podman run -d --name kinc-cluster \
            --hostname kinc-control-plane \
            --cgroups=split \
            --cap-add=all \
            --device /dev/fuse \
            --tmpfs /tmp:rw,rprivate,nosuid,nodev,tmpcopyup \
            --tmpfs /run:rw,rshared,nosuid,nodev,tmpcopyup \
            --tmpfs /run/lock:rw,rprivate,nosuid,nodev,tmpcopyup \
            --volume kinc-var-data:/var:rw,rshared \
            --volume /lib/modules:/lib/modules:ro \
            --volume $HOME/.local/share/containers/storage:/root/.local/share/containers/storage:rw \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv6.conf.all.keep_addr_on_down=1 \
            --sysctl net.netfilter.nf_conntrack_tcp_timeout_established=86400 \
            --sysctl net.netfilter.nf_conntrack_tcp_timeout_close_wait=3600 \
            -p 127.0.0.1:6443:6443/tcp \
            --env container=podman \
            ${{ env.KINC_IMAGE }}
          
          echo "⏳ Waiting for kinc cluster initialization..."
          echo "   First run: 2-5 minutes (downloads container images)"
          echo "   Subsequent runs: ~40 seconds (images cached)"
          
          # Wait for API server to start and be ready (check for HTTP 200)
          timeout 300 bash -c 'until curl -k -s -o /dev/null -w "%{http_code}" https://localhost:6443/healthz 2>/dev/null | grep -q "200"; do sleep 2; done'
          echo "✅ API server responding"
          # Wait for kinc's OWN completion signal before asking kubectl anything.
          #
          # kinc-postinit writes /var/lib/kinc-initialized when the cluster has finished
          # coming up, and kinc's deploy.sh and run-validation.sh both wait on exactly
          # this. The API answering /healthz is not that signal: it responds while
          # postinit is still applying addons, so everything after it was racing.
          #
          # This is what made "Waiting for storage provisioner..." fail on v1.37 - the
          # local-path-storage namespace had simply not been created yet, and 60 seconds
          # of guessing was standing in for a signal the container was already offering.
          timeout 300 bash -c 'until podman exec kinc-cluster test -f /var/lib/kinc-initialized 2>/dev/null; do sleep 2; done' || true
          # If kinc never reports ready, say why. Without this the step fails with a
          # bare exit 124 and the container is thrown away by the cleanup step, so every
          # diagnosis costs another full run.
          if ! podman exec kinc-cluster test -f /var/lib/kinc-initialized 2>/dev/null; then
            echo "::group::kinc did not finish initialising - diagnostics"
            echo "--- failed/activating units ---"
            podman exec kinc-cluster systemctl list-units --type=service --state=failed,activating --no-legend --no-pager 2>&1 | head -20 || true
            echo "--- kubeadm-init.log (tail) ---"
            podman exec kinc-cluster tail -60 /var/log/kinc/kubeadm-init.log 2>&1 || true
            echo "--- kubelet errors ---"
            podman exec kinc-cluster journalctl -u kubelet --no-pager -n 300 2>&1 | grep -iE "error|fail" | tail -20 || true
            echo "--- crictl ---"
            podman exec kinc-cluster crictl ps -a 2>&1 | head -15 || true
            echo "::endgroup::"
            exit 1
          fi
          echo "✅ kinc reports initialization complete"
          
          # Extract kubeconfig
          mkdir -p ~/.kube
          podman cp kinc-cluster:/etc/kubernetes/admin.conf ~/.kube/config
          sed -i 's|server: https://.*:6443|server: https://127.0.0.1:6443|g' ~/.kube/config
          
          # Wait for all system pods to be ready
          echo "⏳ Waiting for system pods to be ready..."
          # kubectl wait --all ERRORS IMMEDIATELY when the namespace holds no pods
          # yet - "no matching resources found". That is not a timeout, so --timeout
          # never applies and the step fails in seconds. The API answers /healthz
          # before the static pod manifests have been read, so there is a window where
          # the namespace is empty. Wait for a pod to EXIST before waiting for Ready.
          timeout 120 bash -c 'until [ "$(kubectl get pods -n kube-system --no-headers 2>/dev/null | wc -l)" -gt 0 ]; do sleep 2; done'
          kubectl wait --for=condition=Ready pods --all -n kube-system --timeout=300s
          
          # Wait for local-path-storage namespace and pods to exist (may take a moment to be created)
          echo "⏳ Waiting for storage provisioner..."
          timeout 60 bash -c 'until kubectl get namespace local-path-storage >/dev/null 2>&1; do sleep 2; done'
          timeout 60 bash -c 'until kubectl get pods -n local-path-storage 2>/dev/null | grep -q local-path-provisioner; do sleep 2; done'
          # kubectl wait --all ERRORS IMMEDIATELY when the namespace holds no pods
          # yet - "no matching resources found". That is not a timeout, so --timeout
          # never applies and the step fails in seconds. The API answers /healthz
          # before the static pod manifests have been read, so there is a window where
          # the namespace is empty. Wait for a pod to EXIST before waiting for Ready.
          timeout 120 bash -c 'until [ "$(kubectl get pods -n local-path-storage --no-headers 2>/dev/null | wc -l)" -gt 0 ]; do sleep 2; done'
          kubectl wait --for=condition=Ready pods --all -n local-path-storage --timeout=60s
          
          # Verify cluster
          echo ""
          echo "📊 Cluster Status:"
          kubectl get nodes -o wide
          kubectl get pods -A
          kubectl cluster-info

      # Run operator deployment tests
      - name: Run operator tests
        run: |
          go mod tidy
          make test-operator

      # Collect and upload operator test logs
      - name: Upload operator test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operator-test-logs-${{ github.run_number }}
          path: |
            tests/operator-ci/logs/*.log
            tests/operator-ci/logs/*.json
          retention-days: 30
        continue-on-error: true

      # Cleanup kinc cluster
      - name: Cleanup kinc cluster
        if: always()
        run: |
          podman rm -f kinc-cluster || true
          podman volume rm kinc-var-data || true
