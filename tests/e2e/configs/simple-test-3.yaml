# Simple E2E Test 3 - Namespace ConfigMap by Label
output_dir: "./logs/test3"
log_level: "debug"
auto_shutdown_sec: 120
json_export: true

namespaces:
  - name_selector: "faro-test-3"
    resources:
      "v1/configmaps":
        name_selector: "test-config-1"
        label_selector: "app=faro-test"
# /ready is how the test knows every informer has listed before it applies
# manifests; a port per test, since tests run in parallel
metrics:
  enabled: true
  port: 19183
  bind_addr: "127.0.0.1"
