# Simple E2E Test 2 - Resource-Centric ConfigMap Informer
output_dir: "./logs/test2"
log_level: "debug"
auto_shutdown_sec: 120
json_export: true

resources:
  - gvr: "v1/configmaps"
    scope: "Namespaced"
    namespace_names:
      - "faro-test-2"
    name_selector: "test-config-1"
# /ready is how the test knows every informer has listed before it applies
# manifests; a port per test, since tests run in parallel
metrics:
  enabled: true
  port: 19182
  bind_addr: "127.0.0.1"
