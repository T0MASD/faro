# Simple E2E Test 5 - Namespace monitoring only
output_dir: "./logs/test5"
log_level: "debug"
auto_shutdown_sec: 120
json_export: true

# Monitor cluster-scoped namespace resource
# NOTE: Changed from "faro-*" (shell glob) to exact name for server-side filtering
resources:
  - gvr: "v1/namespaces"
    scope: "Cluster"
    name_selector: "faro-test-5"
# /ready is how the test knows every informer has listed before it applies
# manifests; a port per test, since tests run in parallel
metrics:
  enabled: true
  port: 19185
  bind_addr: "127.0.0.1"
