# Simple E2E Test 1 - Namespace-centric ConfigMap by name
output_dir: "./logs/test1"
log_level: "debug"
auto_shutdown_sec: 120
json_export: true

namespaces:
  - name_selector: "faro-test-1"
    resources:
      "v1/configmaps":
        name_selector: "test-config-1"
# /ready is how the test knows every informer has listed before it applies
# manifests; a port per test, since tests run in parallel
metrics:
  enabled: true
  port: 19181
  bind_addr: "127.0.0.1"
