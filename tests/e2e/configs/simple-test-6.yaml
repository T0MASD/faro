# Simple E2E Test 6 - Combined: Namespace + ConfigMap monitoring
output_dir: "./logs/test6"
log_level: "debug"
auto_shutdown_sec: 120
json_export: true

# Monitor cluster-scoped namespace resource
resources:
  - gvr: "v1/namespaces"
    scope: "Cluster"
    name_selector: "faro-test-6"

# Monitor namespace-scoped configmaps
namespaces:
  - name_selector: "faro-test-6"
    resources:
      "v1/configmaps":
        name_selector: "test-config-1"
# /ready is how the test knows every informer has listed before it applies
# manifests; a port per test, since tests run in parallel
metrics:
  enabled: true
  port: 19186
  bind_addr: "127.0.0.1"
