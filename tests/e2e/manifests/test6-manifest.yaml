apiVersion: v1
kind: Namespace
metadata:
  name: faro-test-6
  labels:
    test-label: "faro-namespace"
    workload-type: "e2e-test"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-config-1
  namespace: faro-test-6
  labels:
    app: "faro-test"
data:
  key1: "value1"
  config: "test-data"
---
# Decoy: the right namespace, not the name the config selects
apiVersion: v1
kind: ConfigMap
metadata:
  name: decoy-wrong-name
  namespace: faro-test-6
  annotations:
    faro-e2e/decoy: "true"
  labels:
    app: "faro-test"
data:
  decoy: "true"
---
# Decoy: a namespace the name selector does not select
apiVersion: v1
kind: Namespace
metadata:
  name: faro-test-6-decoy
  annotations:
    faro-e2e/decoy: "true"
