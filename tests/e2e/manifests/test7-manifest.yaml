  name: test-config-2
  namespace: faro-test-7
  labels:
    app: "faro-test"
data:
  key2: "value2"
  config: "test-data-2"
---
# Decoy: the right namespace, not the name either entry selects
apiVersion: v1
kind: ConfigMap
metadata:
  name: decoy-wrong-name
  namespace: faro-test-7
  annotations:
    faro-e2e/decoy: "true"
  labels:
    app: "faro-test"
data:
  decoy: "true"
