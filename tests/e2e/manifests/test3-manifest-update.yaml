apiVersion: v1
kind: Namespace
metadata:
  name: faro-test-3
  labels:
    test-label: "faro-namespace"
    workload-type: "e2e-test"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-config-1
  namespace: faro-test-3
  labels:
    app: "faro-test"
data:
  key1: "updated-value1"
  config: "updated-test-data"
  new-key: "new-value"
---
# Decoy: the right label, not the name the config selects
apiVersion: v1
kind: ConfigMap
metadata:
  name: decoy-wrong-name
  namespace: faro-test-3
  annotations:
    faro-e2e/decoy: "true"
  labels:
    app: "faro-test"
data:
  decoy: "true"
---
# Decoy: neither the name nor the label the config selects
apiVersion: v1
kind: ConfigMap
metadata:
  name: decoy-wrong-label
  namespace: faro-test-3
  annotations:
    faro-e2e/decoy: "true"
  labels:
    app: "other"
data:
  decoy: "true"
