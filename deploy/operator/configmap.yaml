---
apiVersion: v1
kind: ConfigMap
metadata:
  name: faro-operator-config
  namespace: faro-system
  labels:
    app.kubernetes.io/name: faro-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: faro
data:
  config.yaml: |
    # Faro Operator Configuration
    
    # Output directory for logs and events
    output_dir: "/var/faro/events"
    
    # Logging configuration
    log_level: "info"  # debug, info, warning, error, fatal
    
    # Auto-shutdown (0 = run indefinitely, perfect for operator mode)
    auto_shutdown_sec: 0
    
    # Enable JSON event export
    json_export: true
    
    # Prometheus metrics configuration
    metrics:
      enabled: true
      port: 8080
      path: "/metrics"
      bind_addr: "0.0.0.0"
    
    # Namespace-centric configuration
    # `fields` names object paths copied into the emitted event. Without
    # it a capture says WHAT changed and never WHY - a restarting pod
    # produces Event objects whose reason and message explain it, and
    # neither is metadata, so they were simply absent from the record.
    #
    # Opt-in per GVR, on pods and events only. What makes a broad capture
    # affordable is that each record stays small; services, deployments
    # and jobs are here to prove the watch works, not to be diagnosed
    # from, so they carry identity alone.
    namespaces:
      - name_selector: "faro-test-validation"
        resources:
          "v1/pods":
            fields:
              - "status.phase"
              - "status.containerStatuses.restartCount"
              - "status.containerStatuses.lastState.terminated.reason"
              - "status.containerStatuses.lastState.terminated.exitCode"
          "v1/services": {}
          "apps/v1/deployments": {}
          "batch/v1/jobs": {}
          "v1/events":
            fields:
              - "reason"
              - "message"
              - "type"
              - "involvedObject.kind"
              - "involvedObject.name"

